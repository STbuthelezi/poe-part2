<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduHub - Community & Peer Review</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); }

    header { background-color: var(--card-bg); border-bottom: 1px solid #e2e8f0; }
    nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-color); font-weight: 500; }
    .nav-links a.active { color: var(--primary-color); }

    main { max-width: 1000px; margin: 2rem auto; padding: 0 2rem; }

    .forum-section, .doc-section { background: var(--card-bg); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    /* Discussion Forum */
    .post { border-bottom: 1px solid #e2e8f0; padding: 1rem 0; }
    .post-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; color: #64748b; }
    .like-btn { background: none; border: none; color: var(--primary-color); cursor: pointer; font-size: 1rem; }

    /* New Post Form */
    textarea { width: 100%; height: 80px; padding: 0.5rem; margin-top: 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; }
    .btn { padding: 0.5rem 1rem; background-color: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 0.5rem; }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">EduHub 🎓</div>
      <ul class="nav-links">
        <li><a href="index.html">Resources</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="community.html" class="active">Community</a></li>
        <li><a href="tutoring.html">Live Tutoring</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="forum-section">
      <h2>Discussion Forum</h2>
      <div id="postsContainer">
        <!-- Posts render here -->
      </div>

      <h3 style="margin-top: 1.5rem;">Start a Topic</h3>
      <textarea id="postInput" placeholder="Ask a question or share a study tip..."></textarea>
      <button class="btn" onclick="addPost()">Post Topic</button>
    </section>
  </main>

  <script>
    // Forum Interaction & Social Features
    const posts = [
      { id: 1, author: "Alex", content: "Does anyone have a good trick for remembering the Krebs cycle?", likes: 4 },
      { id: 2, author: "Jordan", content: "Looking for peer review partners on a History essay!", likes: 2 }
    ];

    function renderPosts() {
      const container = document.getElementById("postsContainer");
      container.innerHTML = "";
      posts.forEach((post, index) => {
        const div = document.createElement("div");
        div.className = "post";
        div.innerHTML = `
          <div class="post-header">
            <strong>${post.author}</strong>
          </div>
          <p>${post.content}</p>
          <button class="like-btn" onclick="likePost(${index})">👍 Like (${post.likes})</button>
        `;
        container.appendChild(div);
      });
    }

    function addPost() {
      const text = document.getElementById("postInput").value;
      if (text.trim() !== "") {
        posts.unshift({ id: Date.now(), author: "You", content: text, likes: 0 });
        document.getElementById("postInput").value = "";
        renderPosts();
      }
    }

    function likePost(index) {
      posts[index].likes++;
      renderPosts();
    }

    document.addEventListener("DOMContentLoaded", renderPosts);
  </script>
</body>
</html>
