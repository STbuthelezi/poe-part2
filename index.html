<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduHub - Educational Resource Hub</title>
  <style>
    /* CSS: Design Principles, Hierarchy & Color Scheme */
    :root {
      --primary-color: #2563eb;
      --secondary-color: #1e40af;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --muted-text: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }

    /* Navigation */
    header { background-color: var(--card-bg); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
    nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-color); font-weight: 500; transition: color 0.2s; }
    .nav-links a.active, .nav-links a:hover { color: var(--primary-color); }

    /* Main Container */
    main { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }

    /* Recommendation Banner */
    .hero { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; padding: 2.5rem; border-radius: 12px; margin-bottom: 2rem; }
    .hero h1 { margin-bottom: 0.5rem; font-size: 2rem; }
    .search-box { display: flex; gap: 10px; margin-top: 1rem; }
    .search-box input { flex: 1; padding: 0.75rem; border: none; border-radius: 6px; font-size: 1rem; }
    .search-box button { background-color: #0f172a; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; }

    /* Grid Layout for Resources */
    .section-title { font-size: 1.5rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .card { background: var(--card-bg); padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .tag { display: inline-block; background: #dbeafe; color: var(--primary-color); padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-bottom: 0.5rem; }
    
    .btn { display: inline-block; margin-top: 1rem; padding: 0.5rem 1rem; background-color: var(--primary-color); color: white; text-decoration: none; border-radius: 6px; border: none; cursor: pointer; }

    /* Mobile Accessibility Adjustments */
    @media (max-width: 768px) {
      nav { flex-direction: column; gap: 1rem; }
      .search-box { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">EduHub 🎓</div>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Resources</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="community.html">Community</a></li>
        <li><a href="tutoring.html">Live Tutoring</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Find Materials Tailored to Your Learning</h1>
      <p>Search textbooks, study guides, and lecture slides across subjects.</p>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by topic, course, or material..." aria-label="Search resources">
        <button onclick="filterResources()">Search</button>
      </div>
    </section>

    <h2 class="section-title">Recommended Resources</h2>
    <section class="grid" id="resourceGrid">
      <!-- Dynamic Resource Cards -->
    </section>
  </main>

  <script>
    // JavaScript: Resource Recommendation Engine & Search
    const resources = [
      { id: 1, title: "Introduction to Computer Science", category: "Textbook", topic: "Programming", link: "#" },
      { id: 2, title: "Calculus II: Lecture Slides", category: "Slides", topic: "Mathematics", link: "#" },
      { id: 3, title: "Organic Chemistry Quick Guide", category: "Study Guide", topic: "Chemistry", link: "#" },
      { id: 4, title: "World History: 19th Century Notes", category: "Notes", topic: "History", link: "#" }
    ];

    function displayResources(items) {
      const grid = document.getElementById("resourceGrid");
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = "<p>No educational resources match your search.</p>";
        return;
      }

      items.forEach(res => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <span class="tag">${res.category}</span>
          <h3>${res.title}</h3>
          <p>Subject: ${res.topic}</p>
          <a href="${res.link}" class="btn" aria-label="Download ${res.title}">Access Resource</a>
        `;
        grid.appendChild(card);
      });
    }

    function filterResources() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = resources.filter(res => 
        res.title.toLowerCase().includes(query) || 
        res.topic.toLowerCase().includes(query) ||
        res.category.toLowerCase().includes(query)
      );
      displayResources(filtered);
    }

    // Initial load
    document.addEventListener("DOMContentLoaded", () => displayResources(resources));
  </script>
</body>
</html>
